<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgeting - Input Transaksi Cute Elephant</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Flatpickr CSS & Theme Light/Pink -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  
  <!-- Flatpickr JS -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <style>
    body { 
      background: linear-gradient(135deg, #7c889b 0%, #b89db0 50%, #d8b0c0 100%);
      background-attachment: fixed;
      color: #4a3e47; 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    }
    
    .flatpickr-calendar {
      background: rgba(255, 245, 248, 0.95) !important;
      border: 1.5px solid #d8b0c0 !important;
      box-shadow: 0 10px 25px -5px rgba(120, 90, 110, 0.2) !important;
      border-radius: 16px !important;
      color: #5c4353 !important;
      backdrop-filter: blur(8px);
    }
    .flatpickr-day.selected {
      background: #c88ea7 !important;
      border-color: #c88ea7 !important;
      color: white !important;
    }
    .flatpickr-day:hover {
      background: #f0d6e2 !important;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 30px rgba(70, 60, 80, 0.12);
    }

    .custom-input {
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(220, 180, 200, 0.7);
      color: #52404d;
      transition: all 0.2s ease;
    }

    .custom-input:focus {
      background: rgba(255, 255, 255, 0.9);
      border-color: #c88ea7;
      box-shadow: 0 0 0 3px rgba(200, 142, 167, 0.2);
    }

    select.custom-input:invalid {
      color: rgba(92, 67, 83, 0.45);
      font-style: italic;
      font-weight: 400;
    }

    select option[disabled] {
      color: rgba(92, 67, 83, 0.45);
      font-style: italic;
    }

    select option:not([disabled]) {
      color: #52404d;
      font-style: normal;
      font-weight: 500;
      background: #fdf8fa;
    }

    .custom-input::placeholder {
      color: rgba(92, 67, 83, 0.45);
      font-style: italic;
      font-weight: 400;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md glass-card rounded-3xl p-6 relative overflow-hidden">
    
    <!-- Header Badge -->
    <div class="text-center mb-3">
      <div class="inline-flex items-center justify-center bg-white/50 px-3.5 py-1.5 rounded-full border border-pink-200/60 shadow-sm backdrop-blur-sm">
        <span class="text-2xl mr-1.5">🐘</span>
        <span class="text-xs font-semibold text-pink-900/80 tracking-wide">💕 With Love, Julyo Sechar</span>
      </div>
    </div>

    <!-- Header -->
    <div class="flex items-center justify-between mb-5 pb-3 border-b border-pink-200/50">
      <div>
        <h1 class="text-lg font-bold text-pink-950/80 tracking-wide">INPUT TRANSAKSI</h1>
        <p class="text-xs text-pink-800/60 font-medium">Budgeting Master Sync 🐘💕</p>
      </div>
      <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-medium bg-pink-100/60 text-pink-800 border border-pink-200/70 shadow-sm">
        ● Live Sync
      </span>
    </div>

    <!-- Form -->
    <form id="txForm" onsubmit="handleSubmit(event)" class="space-y-4">
      
      <!-- Tanggal -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-pink-900/70 mb-1">Tanggal</label>
        <div class="relative">
          <input type="text" id="tanggal" placeholder="Pilih Tanggal..." required 
            class="w-full custom-input rounded-xl px-3.5 py-2 text-sm cursor-pointer font-medium">
          <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-pink-400/80">
            📅
          </div>
        </div>
      </div>

      <!-- Kategori -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-pink-900/70 mb-1">Kategori</label>
        <select id="kategori" onchange="handleCategoryChange()" required class="w-full custom-input rounded-xl px-3.5 py-2 text-sm">
          <option value="" disabled selected>-- Pilih Kategori --</option>
          <option value="💸 PINDAH DANA">💸 PINDAH DANA</option>
          <option value="💵 PEMASUKAN">💵 PEMASUKAN</option>
          <option value="💰 TABUNGAN/ INVESTASI">💰 TABUNGAN/ INVESTASI</option>
          <option value="🍚 KEBUTUHAN POKOK">🍚 KEBUTUHAN POKOK</option>
          <option value="🏠 TEMPAT TINGGAL">🏠 TEMPAT TINGGAL</option>
          <option value="🚌 TRANSPORTASI">🚌 TRANSPORTASI</option>
          <option value="🩺 KESEHATAN">🩺 KESEHATAN</option>
          <option value="💇 PERAWATAN DIRI">💇 PERAWATAN DIRI</option>
          <option value="📚 PENGEMBANGAN DIRI">📚 PENGEMBANGAN DIRI</option>
          <option value="🎉 GAYA HIDUP/ HIBURAN">🎉 GAYA HIDUP/ HIBURAN</option>
          <option value="💳 HUTANG / CICILAN">💳 HUTANG / CICILAN</option>
          <option value="⚠️ LAIN-LAIN">⚠️ LAIN-LAIN</option>
        </select>
      </div>

      <!-- Sub Kategori -->
      <div>
        <label id="lblSubKategori" class="block text-xs font-semibold uppercase tracking-wider text-pink-900/70 mb-1">Sub Kategori</label>
        <select id="subKategori" required class="w-full custom-input rounded-xl px-3.5 py-2 text-sm">
          <option value="" disabled selected>-- Pilih Kategori Dulu --</option>
        </select>
      </div>

      <!-- Nominal (Format Rp Otomatis) -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-pink-900/70 mb-1">Nominal (Rp)</label>
        <input type="text" id="nominal" placeholder="Rp 0" required onkeyup="formatRupiahInput(this)" class="w-full custom-input rounded-xl px-3.5 py-2 text-sm font-medium">
      </div>

      <!-- Akun Bank -->
      <div>
        <label id="lblAkun" class="block text-xs font-semibold uppercase tracking-wider text-pink-900/70 mb-1">Akun Bank</label>
        <select id="akun" required class="w-full custom-input rounded-xl px-3.5 py-2 text-sm">
          <option value="" disabled selected>-- Pilih Akun --</option>
          <option value="SEABANK">SEABANK</option>
          <option value="BCA">BCA</option>
          <option value="MANDIRI">MANDIRI</option>
          <option value="DANA">DANA</option>
          <option value="CASH">CASH</option>
        </select>
      </div>

      <!-- Container Dua Tombol Berdampingan -->
      <div class="grid grid-cols-2 gap-3 mt-4">
        <!-- Tombol Simpan Transaksi (Pink) -->
        <button type="submit" id="btnSubmit" class="w-full bg-gradient-to-r from-pink-400/90 to-rose-400/90 hover:from-pink-500 hover:to-rose-500 text-white font-semibold py-2.5 px-3 rounded-xl shadow-sm hover:shadow-md transition duration-200 text-xs sm:text-sm flex justify-center items-center gap-1.5 border border-pink-200/50">
          <span>Simpan Transaksi</span> 🐘
        </button>

        <!-- Tombol Dashboard (Biru Pastel) -->
        <a href="https://docs.google.com/spreadsheets/d/18yaNmMDGq5gFTse9IW_io5n3aaPiVYxpCSEQ5nNg2hY/edit?gid=1752606634#gid=1752606634" target="_blank" class="w-full bg-gradient-to-r from-sky-400/80 to-indigo-400/80 hover:from-sky-500/90 hover:to-indigo-500/90 text-white font-semibold py-2.5 px-3 rounded-xl shadow-sm hover:shadow-md transition duration-200 text-xs sm:text-sm flex justify-center items-center gap-1.5 border border-sky-200/50 text-center">
          <span>Dashboard</span> 📊
        </a>
      </div>

    </form>
    
    <!-- Footer -->
    <div class="mt-4 text-center text-xs text-pink-800/60 font-semibold tracking-wide">
      <span>Elsa & Julyo</span>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxKE6HQJGUPhK8yfcSjRF5LRVbsEhXMn9iuUrZtu-8oT842UohdGdeKtORGhdYBL6Pq8g/exec";

    const fpInstance = flatpickr("#tanggal", {
      dateFormat: "Y-m-d",
      defaultDate: "today",
      allowInput: true,
      clickOpens: true
    });

    const SUB_DATA = {
      "💸 PINDAH DANA": ["SEABANK", "BCA", "MANDIRI", "DANA", "CASH"],
      "💵 PEMASUKAN": ["Gaji / Salary", "Bonus & Komisi", "Dividen Saham", "Pendapatan Lain-Lain", "Penjualan Aset / Properti", "Hibah / Hadiah Uang", "THR / Tunjangan Tahunan"],
      "🍚 KEBUTUHAN POKOK": ["Makanan", "Minuman", "Snack / Cemilan", "Kebutuhan Rumah Tangga", "Kebutuhan Dapur"],
      "🏠 TEMPAT TINGGAL": ["Sewa / KPR Rumah", "Maintenance Rumah", "Listrik", "Air", "Internet"],
      "🚌 TRANSPORTASI": ["BBM", "Ojek Online", "Transportasi Umum", "Maintenance Kendaraan"],
      "🩺 KESEHATAN": ["Vitamin & Obat", "Asuransi / BPJS", "Periksa ke Dokter"],
      "💇 PERAWATAN DIRI": ["Skincare", "Barbershop / Salon", "Bodycare", "Gym", "IPL", "Pilates", "Treatment"],
      "📚 PENGEMBANGAN DIRI": ["Pendidikan / Pelatihan", "Buku", "Kursus", "Aplikasi Belajar", "Webinar"],
      "💰 TABUNGAN/ INVESTASI": ["Safety Money", "Deposito Bank", "Reksadana", "Arisan", "Logam Mulia", "Saham"],
      "🎉 GAYA HIDUP/ HIBURAN": ["Makan di Luar", "Coffee Shop", "Subs (Nx, Spotify, dll.)", "Liburan / Traveling", "Hobi & Rekreasi", "Cash Out"],
      "💳 HUTANG / CICILAN": ["Pinjaman Modal Usaha", "Cicilan Kredit / Pinjaman", "Sumbangan & Donasi Rutin", "KPR"],
      "⚠️ LAIN-LAIN": ["Admin Bank", "Pengeluaran Tak Terduga", "Bantu Keluarga", "Barang Rusak", "Parkir"]
    };

    // Fungsi Format Input ke Rupiah
    function formatRupiahInput(el) {
      let value = el.value.replace(/[^0-9]/g, '');
      if (value === '') {
        el.value = '';
        return;
      }
      let formatted = new Intl.NumberFormat('id-ID').format(value);
      el.value = 'Rp ' + formatted;
    }

    function handleCategoryChange() {
      const kat = document.getElementById('kategori').value;
      const subSelect = document.getElementById('subKategori');
      const lblSub = document.getElementById('lblSubKategori');
      const lblAkun = document.getElementById('lblAkun');

      if (kat === "💸 PINDAH DANA") {
        lblSub.innerText = "DARI REKENING (ASAL)";
        lblAkun.innerText = "KE REKENING (TUJUAN)";
      } else {
        lblSub.innerText = "SUB KATEGORI";
        lblAkun.innerText = "AKUN BANK";
      }

      subSelect.innerHTML = '<option value="" disabled selected>-- Pilih Sub Kategori --</option>';
      if (SUB_DATA[kat]) {
        SUB_DATA[kat].forEach(sub => {
          const opt = document.createElement('option');
          opt.value = sub;
          opt.innerText = sub;
          subSelect.appendChild(opt);
        });
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerHTML = '<span>Memproses...</span> 🐘';

      // Mengambil angka murni (menghapus "Rp " dan titik ".")
      const rawNominal = document.getElementById('nominal').value.replace(/[^0-9]/g, '');

      if (!rawNominal || parseInt(rawNominal) <= 0) {
        alert("Silakan masukkan nominal transaksi yang valid!");
        btn.disabled = false;
        btn.innerHTML = '<span>Simpan Transaksi</span> 🐘';
        return;
      }

      const payload = {
        kolomA: document.getElementById('tanggal').value,
        kolomB: document.getElementById('kategori').value,
        kolomC: document.getElementById('subKategori').value,
        kolomD: rawNominal, // Mengirim angka murni ke Google Sheets
        kolomE: document.getElementById('akun').value
      };

      try {
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        alert("✅ Transaksi Berhasil Dicatat ke Google Sheets!");
        
        document.getElementById('nominal').value = '';
        document.getElementById('kategori').selectedIndex = 0;
        document.getElementById('subKategori').innerHTML = '<option value="" disabled selected>-- Pilih Kategori Dulu --</option>';
        document.getElementById('akun').selectedIndex = 0;
        
        fpInstance.setDate("today");
        
        handleCategoryChange();

      } catch (err) {
        alert("❌ Gagal mencatat: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Simpan Transaksi</span> 🐘';
      }
    }
  </script>
</body>
</html>
